[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Como es una sola página (sin router), cualquier ruta cae en index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # No afecta a /.netlify/functions/*, Netlify las resuelve antes que los redirects
